name: Check sources

# Reads every candidate source once and prints what came back. Nothing is published.
on:
  workflow_dispatch:
    inputs:
      groups:
        description: "Which groups (states, markets, social, extra); empty for all"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Alaska's missing intermediate certificate
        run: |
          curl -sSf -o /tmp/ak.crt http://secure.globalsign.com/cacert/gsgccr46ovtlsca2025.crt
          openssl x509 -inform der -in /tmp/ak.crt -out /tmp/ak.pem
          echo "NODE_EXTRA_CA_CERTS=/tmp/ak.pem" >> "$GITHUB_ENV"
      - run: node scripts/probe.mjs ${{ inputs.groups }}
      - name: Decision Desk HQ and Polymarket control
        continue-on-error: true
        run: node scripts/probe_ddhq.mjs
      - name: Count readers against real files
        continue-on-error: true
        run: |
          node scripts/try_reader.mjs FL "https://results.elections.myflorida.com/ResultsExtract.Asp?ElectionDate=11/5/2024&OfficialResults=N&PartyRaces=N&DataMode=&FormsButton1=Download" "Debbie Mucarsel-Powell" "Rick Scott"
          node scripts/try_reader.mjs FL
          node scripts/try_reader.mjs OH
          node scripts/try_reader.mjs AK
          node scripts/try_reader.mjs NE
          curl -sS -m 30 "https://liveresults.ohiosos.gov/Api/v1/download?filename=VSSC1622XmlFileBlob" | head -c 1500; echo
          curl -sS -m 30 "https://results.elections.myflorida.com/ResultsExtract.Asp?ElectionDate=11/5/2024&OfficialResults=N&PartyRaces=N&DataMode=&FormsButton1=Download" | head -3
      - name: Alaska certificate chain
        continue-on-error: true
        run: |
          echo | openssl s_client -connect www.elections.alaska.gov:443 -servername www.elections.alaska.gov -showcerts 2>/dev/null | grep -E "s:|i:|BEGIN" | head -20
          echo | openssl s_client -connect www.elections.alaska.gov:443 -servername www.elections.alaska.gov 2>/dev/null | openssl x509 -noout -text | grep -A2 "Authority Information Access" || true

  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: One update, not published
        run: |
          node scripts/fetch.mjs --state /tmp/state --out /tmp/out && node -e "const j=require('/tmp/out/live.json'); for (const [k,v] of Object.entries(j.races)) console.log(k, JSON.stringify({counts: v.counts && {ok: v.counts.ok, error: v.counts.error, votes: v.counts.votes}, markets: v.markets, call: v.call})); console.log('control', JSON.stringify(j.control)); console.log('clues', JSON.stringify(j.clues)); console.log('feed', j.feed.length); for (const f of j.feed.slice(0,15)) console.log(' ', f.kind, f.via||'', f.race, f.time, f.author||f.outlet, '|', f.text.slice(0,100))"
